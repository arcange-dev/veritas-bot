# Veritas Bot API: ASGI (daphne) behind Fly's proxy, Postgres on Neon, Redis on
# the private veritas-redis app. Deploy with: fly deploy -c fly.api.toml
app = "veritas-api"
primary_region = "jnb"          # Johannesburg: lowest latency to East Africa

[build]
  dockerfile = "infrastructure/docker/api.Dockerfile"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.prod"
  # Fly terminates TLS and forwards HTTP internally; Django must not re-redirect.
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # The local-runner relay and live session streams are WebSockets. An idle
  # machine would drop every open connection, so keep one running at all times.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

# Migrations run once per deploy, not per machine.
[deploy]
  release_command = "python manage.py migrate --no-input && python manage.py collectstatic --no-input"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"              # daphne + Django; 256MB is tight under load

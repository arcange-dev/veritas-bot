# Static hosting for the built SPA.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/projects, /dashboard, ...) have no file on disk.
    # Without this fallback a refresh on any deep link returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or a deploy ships stale asset references.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# Deliberately not at .github/workflows/ci.yml yet: enabling CI is a decision, and this file has
# never been executed. Move it into place when the repository has a remote.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: superagent
          POSTGRES_PASSWORD: superagent
          POSTGRES_DB: superagent
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python manage.py check
      - name: Migrations must be committed
        run: python manage.py makemigrations --check --dry-run
      - run: pytest -q --cov=. --cov-report=term-missing
      - run: bandit -r . -x ./tests
      - run: pip-audit

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm", cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev

  runner:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/local-runner } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
